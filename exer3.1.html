<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercício 3.1 - Gerador de Saudação</title>
</head>

<body>

    <h1>Gerador de Saudação</h1>

    <input 
        type="text" 
        id="campoNome" 
        placeholder="Digite seu nome"
    >

    <button onclick="saudarUsuario()">
        Saudar
    </button>

    <p id="mensagem"></p>


    <script>

        // Função que recebe um nome e retorna uma saudação
        function construirSaudacao(nome) {

            return "Olá, " + nome + "! Seja bem-vindo ao curso de Web!";
        }

        // Função executada quando o botão for clicado
        function saudarUsuario() {
            // Pega o que foi digitado no campo
            let nome = document.getElementById("campoNome").value;
            // Chama a função construirSaudacao()
            let mensagem = construirSaudacao(nome);
            // Mostra a mensagem na página
            document.getElementById("mensagem").innerText = mensagem;
        }

    </script>

</body>

</html>
