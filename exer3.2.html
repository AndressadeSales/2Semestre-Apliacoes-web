<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercício 3.2 - Calculadora de Média</title>
</head>

<body>

    <h1>Calculadora de Média</h1>

    <label for="nota1">Nota 1:</label>
    <input 
        type="number" 
        id="nota1"
        placeholder="Digite a primeira nota"
    >

    <br><br>

    <label for="nota2">Nota 2:</label>
    <input 
        type="number" 
        id="nota2"
        placeholder="Digite a segunda nota"
    >

    <br><br>

    <button onclick="calcular()">
        Calcular Média
    </button>

    <p id="resultadoCalculo"></p>


    <script>

        // Função responsável apenas por calcular a média
        function calcularMedia(n1, n2) {
            return (n1 + n2) / 2;
        }

        // Função executada pelo botão
        function calcular() {
            // Pega a primeira nota e transforma em número
            let nota1 = Number(
                document.getElementById("nota1").value
            );
            // Pega a segunda nota e transforma em número
            let nota2 = Number(
                document.getElementById("nota2").value
            );
            // Chama a função calcularMedia()
            let media = calcularMedia(nota1, nota2);

            // Encontra o elemento que mostrará o resultado
            let resultado = document.getElementById(
                "resultadoCalculo"
            );
            
            // Mostra a média
            resultado.innerText = "Média: " + media;

            // Verifica se o aluno foi aprovado
            if (media >= 7) {
                resultado.innerText += " - Aprovado";
                // Coloca o texto na cor verde
                resultado.style.color = "green";
            } else {
                resultado.innerText += " - Recuperação";
                // Coloca o texto na cor vermelha
                resultado.style.color = "red";
            }
        }

    </script>

</body>

</html>
