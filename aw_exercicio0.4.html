<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; margin: 0; background: #f8f9fa; }
    .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; }
    .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 8px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px; background: #e9ecef; border-bottom: 1px solid #ddd; border-radius: 4px; margin-bottom: 6px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Minha Lista</h2>
    <div class="input-group">
      <input type="text" id="campo-tarefa" placeholder="Digite uma tarefa...">
      <button id="btn-adicionar">Add</button>
    </div>
    <ul id="lista-tarefas"></ul>
  </div>

  <script>
    
    const campoTarefa = document.getElementById("campo-tarefa");
    const btnAdicionar = document.getElementById("btn-adicionar");
    const listaTarefas = document.getElementById("lista-tarefas");

    btnAdicionar.addEventListener("click", function () {
      const texto = campoTarefa.value.trim();

      if (texto !== "") {
        const item = document.createElement("li");
        item.innerText = texto;

        listaTarefas.appendChild(item);

        campoTarefa.value = "";
        campoTarefa.focus();
      }
    });

  </script>
</body>
</html>
