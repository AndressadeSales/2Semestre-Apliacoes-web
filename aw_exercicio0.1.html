<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f2f5; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
    h1 { color: #333; }
    button { padding: 10px 20px; font-size: 1rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="mensagem">Olá, Mundo!</h1>
    <button id="btn-alterar">Mudar Mensagem</button>
  </div>

  <script>
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("btn-alterar");

    let alterado = false;

    botao.addEventListener("click", function () {
      if (!alterado) {
        mensagem.innerText = "Bem-vindo ao JavaScript!";
      } else {
        mensagem.innerText = "Olá Galinha 🐔 Ops: Frango";
      }

      alterado = !alterado;
        });
  </script>
</body>
</html>
